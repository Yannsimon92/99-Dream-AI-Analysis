<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  html,body{margin:0}
  body{background:var(--cream);padding:30px 30px;box-sizing:border-box}
  .ds-pipeline{grid-template-columns:repeat(4,1fr)}
</style>
</head>
<body>
  <div class="ds-pipeline">
    <div class="ds-step"><span class="ds-step-num">01</span><div class="ds-step-blob" style="--c:#f0a890"></div><div class="ds-step-name">Capture</div><div class="ds-step-detail">narrative input</div></div>
    <div class="ds-step"><span class="ds-step-num">02</span><div class="ds-step-blob" style="--c:#a8c8e8"></div><div class="ds-step-name">Analyse</div><div class="ds-step-detail">emotion vector</div></div>
    <div class="ds-step"><span class="ds-step-num">03</span><div class="ds-step-blob" style="--c:#c898d0"></div><div class="ds-step-name">Map</div><div class="ds-step-detail">colour · shape</div></div>
    <div class="ds-step"><span class="ds-step-num">04</span><div class="ds-step-blob" style="--c:#e8c870"></div><div class="ds-step-name">Render</div><div class="ds-step-detail">sensory output</div></div>
  </div>
</body>
</html>
