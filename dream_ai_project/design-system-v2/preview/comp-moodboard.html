<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  html,body{margin:0}
  body{background:var(--cream);padding:24px 30px;box-sizing:border-box}
  .ds-moodboard{grid-auto-rows:88px}
</style>
</head>
<body>
  <div class="ds-moodboard">
    <div class="ds-mood-item is-tall" style="background:linear-gradient(150deg,#f0a890,#e8a880)"><span class="ds-mood-label">warmth</span></div>
    <div class="ds-mood-item" style="background:linear-gradient(150deg,#a8c8e8,#5070b0)"><span class="ds-mood-label">calm</span></div>
    <div class="ds-mood-item" style="background:linear-gradient(150deg,#c898d0,#8050a0)"><span class="ds-mood-label">mystery</span></div>
    <div class="ds-mood-item" style="background:linear-gradient(150deg,#e8c870,#e8a880)"><span class="ds-mood-label">joy</span></div>
    <div class="ds-mood-item" style="background:linear-gradient(150deg,#c8d8a0,#a8c8e8)"><span class="ds-mood-label">serenity</span></div>
  </div>
</body>
</html>
