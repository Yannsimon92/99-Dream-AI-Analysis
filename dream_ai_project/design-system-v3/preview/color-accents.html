<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--cream);padding:30px 34px;box-sizing:border-box}
  .grid{display:flex;gap:16px}
  .sw{flex:1}
  .chip{height:88px;border-radius:12px;border:0.5px solid var(--ink-12)}
  .nm{font-family:var(--mono);font-size:11px;color:var(--ink);margin-top:10px}
  .hx{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-50);margin-top:2px}
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#b85040"></div><div class="nm">terracotta</div><div class="hx">#b85040 · primary · italics</div></div>
    <div class="sw"><div class="chip" style="background:#5070b0"></div><div class="nm">blue</div><div class="hx">#5070b0 · secondary</div></div>
    <div class="sw"><div class="chip" style="background:#8050a0"></div><div class="nm">violet</div><div class="hx">#8050a0 · tertiary</div></div>
  </div>
</body>
</html>
