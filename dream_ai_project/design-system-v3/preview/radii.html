<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--cream);padding:30px 36px;box-sizing:border-box}
  .grid{display:flex;gap:28px;align-items:flex-end}
  .it{text-align:center}
  .box{width:96px;height:72px;background:var(--surface);border:0.5px solid var(--ink-20)}
  .pill{width:120px;height:40px;border-radius:100px;background:var(--surface);border:0.5px solid var(--ink-20)}
  .circ{width:72px;height:72px;border-radius:50%;background:var(--surface);border:0.5px solid var(--ink-20)}
  .nm{font-family:var(--mono);font-size:10px;color:var(--ink-70);margin-top:12px}
</style>
</head>
<body>
  <div class="grid">
    <div class="it"><div class="box" style="border-radius:14px"></div><div class="nm">card · 14px</div></div>
    <div class="it"><div class="pill"></div><div class="nm">pill · 100px</div></div>
    <div class="it"><div class="circ"></div><div class="nm">blob · 50%</div></div>
  </div>
</body>
</html>
