<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--cream);padding:30px 36px;box-sizing:border-box}
  .row{display:flex;align-items:center;gap:16px;margin-bottom:12px}
  .bar{height:18px;background:var(--terracotta);opacity:.85;border-radius:3px}
  .tk{font-family:var(--mono);font-size:11px;color:var(--ink);width:48px}
  .px{font-family:var(--mono);font-size:10px;color:var(--ink-50)}
</style>
</head>
<body>
  <div class="row"><span class="tk">xs</span><div class="bar" style="width:8px"></div><span class="px">8px</span></div>
  <div class="row"><span class="tk">sm</span><div class="bar" style="width:16px"></div><span class="px">16px</span></div>
  <div class="row"><span class="tk">md</span><div class="bar" style="width:24px"></div><span class="px">24px</span></div>
  <div class="row"><span class="tk">lg</span><div class="bar" style="width:32px"></div><span class="px">32px</span></div>
  <div class="row"><span class="tk">xl</span><div class="bar" style="width:48px"></div><span class="px">48px</span></div>
  <div class="row" style="margin:0"><span class="tk">2xl</span><div class="bar" style="width:80px"></div><span class="px">80px · 8px grid</span></div>
</body>
</html>
