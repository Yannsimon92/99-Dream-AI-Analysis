<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--cream);padding:30px 40px;box-sizing:border-box}
  table{border-collapse:collapse;width:100%}
  td{padding:7px 0;vertical-align:baseline;border-bottom:0.5px solid var(--ink-12)}
  .name{font-family:var(--mono);font-size:11px;color:var(--ink-70);width:120px}
  .spec{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-50);text-align:right;width:180px}
  .samp{font-family:var(--serif);font-weight:300;color:var(--ink);line-height:1}
  .samp.mono{font-family:var(--mono)}
</style>
</head>
<body>
  <table>
    <tr><td class="name">display</td><td class="samp" style="font-size:34px">Aa</td><td class="spec">Fraunces 80 / 300</td></tr>
    <tr><td class="name">slide title</td><td class="samp" style="font-size:28px">Aa</td><td class="spec">Fraunces 64 / 300</td></tr>
    <tr><td class="name">section</td><td class="samp" style="font-size:23px">Aa</td><td class="spec">Fraunces 50 / 300</td></tr>
    <tr><td class="name">subtitle</td><td class="samp" style="font-size:18px;font-style:italic">Aa</td><td class="spec">Fraunces it. 22 / 300</td></tr>
    <tr><td class="name">feature</td><td class="samp" style="font-size:15px;font-style:italic">Aa</td><td class="spec">Fraunces it. 17 / 300</td></tr>
    <tr><td class="name">body</td><td class="samp mono" style="font-size:13px">Aa</td><td class="spec">JetBrains 13 / 300</td></tr>
    <tr><td class="name">label</td><td class="samp mono" style="font-size:11px;letter-spacing:.2em">AA</td><td class="spec">JetBrains 10 / 400</td></tr>
    <tr style="border:0"><td class="name">detail</td><td class="samp mono" style="font-size:10px;letter-spacing:.14em">Aa</td><td class="spec">JetBrains 9 / 300</td></tr>
  </table>
</body>
</html>
