<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--cream);padding:30px 34px;box-sizing:border-box}
  .grid{display:flex;gap:12px}
  .sw{flex:1}
  .chip{height:80px;border-radius:12px;border:0.5px solid var(--ink-12)}
  .nm{font-family:var(--mono);font-size:10px;color:var(--ink);margin-top:9px}
  .hx{font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--ink-50);margin-top:2px}
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#1a1410"></div><div class="nm">ink</div><div class="hx">#1a1410</div></div>
    <div class="sw"><div class="chip" style="background:rgba(26,20,16,.7)"></div><div class="nm">ink-70</div><div class="hx">secondary</div></div>
    <div class="sw"><div class="chip" style="background:rgba(26,20,16,.5)"></div><div class="nm">ink-50</div><div class="hx">tertiary</div></div>
    <div class="sw"><div class="chip" style="background:rgba(26,20,16,.35)"></div><div class="nm">ink-35</div><div class="hx">markers</div></div>
    <div class="sw"><div class="chip" style="background:rgba(26,20,16,.2)"></div><div class="nm">ink-20</div><div class="hx">hairline</div></div>
    <div class="sw"><div class="chip" style="background:rgba(26,20,16,.12)"></div><div class="nm">ink-12</div><div class="hx">faint border</div></div>
  </div>
</body>
</html>
