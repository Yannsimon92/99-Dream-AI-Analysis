<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--cream);padding:24px 30px;box-sizing:border-box}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .ph{height:110px;border-radius:12px;overflow:hidden;border:0.5px solid var(--ink-12)}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .cap{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink-50);margin-top:14px}
</style>
</head>
<body>
  <div class="grid">
    <div class="ph"><img src="../assets/imagery/blob-map-people-money.jpg" alt=""></div>
    <div class="ph"><img src="../assets/imagery/constellation-self-discovery.jpg" alt=""></div>
    <div class="ph"><img src="../assets/imagery/contexts-blob-map.jpg" alt=""></div>
    <div class="ph"><img src="../assets/imagery/mood-figure-pastel.jpg" alt=""></div>
  </div>
  <div class="cap">IMAGERY — dreamy · out-of-focus · grainy gradients · liminal figures · two registers: warm (cream/coral) & cool (blue auras)</div>
</body>
</html>
