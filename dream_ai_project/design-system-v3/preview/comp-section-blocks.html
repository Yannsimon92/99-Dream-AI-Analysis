<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  html,body{margin:0}
  body{background:var(--cream);padding:28px 36px;box-sizing:border-box}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .ttl{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink);margin:0 0 6px}
  .tx{font-family:var(--mono);font-size:11px;font-weight:300;line-height:1.7;color:var(--ink-70);margin:0}
</style>
</head>
<body>
  <div class="grid">
    <div class="ds-card ds-section-block">
      <span class="ds-block-label is-supervised">Supervised</span>
      <p class="ttl">Emotion classifier</p>
      <p class="tx">Labelled dreams → emotion tags.</p>
    </div>
    <div class="ds-card ds-section-block">
      <span class="ds-block-label is-unsupervised">Unsupervised</span>
      <p class="ttl">Theme clustering</p>
      <p class="tx">Latent motifs across the corpus.</p>
    </div>
    <div class="ds-card ds-section-block">
      <span class="ds-block-label is-deep">Deep learning</span>
      <p class="ttl">Image synthesis</p>
      <p class="tx">Dream → generated visual.</p>
    </div>
  </div>
</body>
</html>
