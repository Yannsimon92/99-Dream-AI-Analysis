<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--cream);padding:30px 34px;box-sizing:border-box}
  .grid{display:flex;gap:16px}
  .sw{flex:1}
  .chip{height:88px;border-radius:12px;border:0.5px solid var(--ink-12)}
  .nm{font-family:var(--mono);font-size:11px;color:var(--ink);margin-top:10px}
  .hx{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-50);margin-top:2px}
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#f0ece2"></div><div class="nm">cream</div><div class="hx">#f0ece2 · primary bg</div></div>
    <div class="sw"><div class="chip" style="background:#e8e4da"></div><div class="nm">cream-bright</div><div class="hx">#e8e4da · bg variant</div></div>
    <div class="sw"><div class="chip" style="background:#f6f3ec"></div><div class="nm">paper</div><div class="hx">#f6f3ec · lightest</div></div>
  </div>
</body>
</html>
