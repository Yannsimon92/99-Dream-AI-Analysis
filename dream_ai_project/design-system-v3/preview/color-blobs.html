<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--cream);padding:30px 34px;box-sizing:border-box}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  .blob{height:64px;border-radius:50%;filter:blur(10px);opacity:.9;margin:6px auto 16px;width:64px}
  .nm{font-family:var(--mono);font-size:10px;color:var(--ink);text-align:center}
  .em{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--ink-70);text-align:center;margin-top:2px}
</style>
</head>
<body>
  <div class="grid">
    <div><div class="blob" style="background:#f0a890"></div><div class="nm">peach</div><div class="em">warmth</div></div>
    <div><div class="blob" style="background:#a8c8e8"></div><div class="nm">sky</div><div class="em">calm</div></div>
    <div><div class="blob" style="background:#e8c870"></div><div class="nm">yellow</div><div class="em">joy</div></div>
    <div><div class="blob" style="background:#c898d0"></div><div class="nm">lavender</div><div class="em">mystery</div></div>
    <div><div class="blob" style="background:#c8d8a0"></div><div class="nm">sage</div><div class="em">serenity</div></div>
    <div><div class="blob" style="background:#e8a880"></div><div class="nm">coral</div><div class="em">energy</div></div>
  </div>
</body>
</html>
