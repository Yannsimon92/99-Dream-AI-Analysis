<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { margin:0; }
  .scene { position:relative; height:280px; background:var(--sand-300); overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .content { position:relative; z-index:2; text-align:center; max-width:440px; padding:0 24px; }
  .kicker { font-family:var(--font-sans); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--coral-600); margin-bottom:12px; }
  .head { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:38px; line-height:1.12; color:var(--ink-1); }
</style>
</head>
<body>
  <div class="scene">
    <div class="aurora-blob aurora-blob--rose" style="width:240px;height:240px;left:-40px;top:-60px"></div>
    <div class="aurora-blob aurora-blob--periwinkle" style="width:260px;height:260px;right:-50px;bottom:-80px"></div>
    <div class="aurora-blob aurora-blob--peach" style="width:160px;height:160px;right:120px;top:-40px;opacity:.45"></div>
    <div class="content">
      <div class="kicker">Espace latent · 12 480 rêves</div>
      <div class="head">Chaque rêve trouve<br>ses voisins</div>
    </div>
  </div>
</body>
</html>
