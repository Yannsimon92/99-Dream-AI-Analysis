<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--sand-100); font-family: var(--font-sans); padding: 22px 24px; }
  .block { margin-bottom:18px; }
  .lbl { font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin-bottom:9px; }
  .row { display:flex; gap:12px; }
  .sw { flex:1; }
  .chip { height:60px; border-radius:13px; box-shadow: var(--shadow-xs); }
  .name { font-size:11.5px; font-weight:600; color:var(--ink-1); margin-top:8px; }
  .hex { font-size:10.5px; color:var(--ink-3); margin-top:1px; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
  <div class="block">
    <div class="lbl">Accent primaire — Corail / Rouille</div>
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--coral-700)"></div><div class="name">700 · press</div><div class="hex">#A8442A</div></div>
      <div class="sw"><div class="chip" style="background:var(--coral-600)"></div><div class="name">600 · hover</div><div class="hex">#B14A2C</div></div>
      <div class="sw"><div class="chip" style="background:var(--coral-500)"></div><div class="name">500 · accent</div><div class="hex">#C85B3A</div></div>
      <div class="sw"><div class="chip" style="background:var(--coral-200)"></div><div class="name">200</div><div class="hex">#EFC9B8</div></div>
      <div class="sw"><div class="chip" style="background:var(--coral-100)"></div><div class="name">100</div><div class="hex">#F6E0D5</div></div>
    </div>
  </div>
  <div class="block">
    <div class="lbl">Accent secondaire — Lavande</div>
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--lav-600)"></div><div class="name">600 · text</div><div class="hex">#6F5FA6</div></div>
      <div class="sw"><div class="chip" style="background:var(--lav-500)"></div><div class="name">500 · accent</div><div class="hex">#9385C0</div></div>
      <div class="sw"><div class="chip" style="background:var(--lav-200)"></div><div class="name">200</div><div class="hex">#E0D8F0</div></div>
      <div class="sw"><div class="chip" style="background:var(--lav-100)"></div><div class="name">100</div><div class="hex">#EFEAF8</div></div>
    </div>
  </div>
</body>
</html>
