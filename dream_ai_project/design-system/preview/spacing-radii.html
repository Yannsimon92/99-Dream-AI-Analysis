<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--sand-100); padding: 24px 26px; font-family:var(--font-sans); }
  .row { display:flex; gap:16px; align-items:flex-end; }
  .sw { text-align:center; }
  .box { width:78px; height:60px; background:var(--lav-200); border:1.5px solid var(--lav-500); }
  .name { font-size:11.5px; font-weight:600; color:var(--ink-1); margin-top:9px; }
  .px { font-size:10.5px; color:var(--ink-3); }
  .pillbox { width:108px; height:42px; border-radius:var(--radius-pill); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="name">xs</div><div class="px">6px</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="name">sm</div><div class="px">10px</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-md)"></div><div class="name">md · card</div><div class="px">16px</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="name">lg</div><div class="px">24px</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="name">xl</div><div class="px">32px</div></div>
    <div class="sw"><div class="box pillbox" style="background:var(--coral-200);border-color:var(--coral-500)"></div><div class="name">pill · badge</div><div class="px">999px</div></div>
  </div>
</body>
</html>
