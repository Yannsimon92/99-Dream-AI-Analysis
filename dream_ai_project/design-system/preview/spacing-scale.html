<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--sand-100); padding: 24px 28px; font-family:var(--font-sans); }
  .row { display:flex; align-items:center; gap:14px; margin:7px 0; }
  .bar { height:18px; background:var(--coral-200); border-radius:4px; }
  .tok { font-size:12px; font-weight:600; color:var(--ink-1); width:74px; }
  .px { font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
  <div class="row"><span class="tok">space-1</span><div class="bar" style="width:4px"></div><span class="px">4px</span></div>
  <div class="row"><span class="tok">space-2</span><div class="bar" style="width:8px"></div><span class="px">8px</span></div>
  <div class="row"><span class="tok">space-3</span><div class="bar" style="width:12px"></div><span class="px">12px</span></div>
  <div class="row"><span class="tok">space-4</span><div class="bar" style="width:16px"></div><span class="px">16px</span></div>
  <div class="row"><span class="tok">space-6</span><div class="bar" style="width:24px"></div><span class="px">24px</span></div>
  <div class="row"><span class="tok">space-8</span><div class="bar" style="width:32px"></div><span class="px">32px</span></div>
  <div class="row"><span class="tok">space-12</span><div class="bar" style="width:48px"></div><span class="px">48px</span></div>
  <div class="row"><span class="tok">space-16</span><div class="bar" style="width:64px"></div><span class="px">64px · base 4</span></div>
</body>
</html>
